<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>8 Ball Pool - Galaxy AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#050816;font-family:Arial,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 12%,rgba(40,0,90,.5),rgba(5,8,22,.97) 70%)}
.top{display:flex;align-items:center;justify-content:space-between;width:100%;padding:6px 10px;gap:6px}
.home{color:#0ff;text-decoration:none;border:1px solid rgba(0,255,255,.4);padding:6px 12px;border-radius:16px;font-size:12px;background:rgba(0,255,255,.06)}
h1{font-size:18px;letter-spacing:2px;background:linear-gradient(90deg,#0ff,#f0f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(0,255,255,.35)}
.coinpill{background:rgba(255,214,10,.1);border:1px solid rgba(255,214,10,.5);color:#ffd60a;border-radius:16px;padding:5px 10px;font-size:13px;font-weight:bold;text-shadow:0 0 8px #ff0}
.tbtn{background:rgba(0,255,255,.08);border:1px solid rgba(0,255,255,.4);color:#0ff;border-radius:14px;font-size:16px;padding:5px 9px}
#turnrow{display:flex;justify-content:center;padding:2px 0 4px}
#turn{font-size:13px;font-weight:bold;padding:6px 12px;border-radius:14px;border:2px solid #0ff;min-width:110px;text-align:center}
#wrap{position:relative;line-height:0}
canvas{display:block;border-radius:12px;touch-action:none}
#pwr{position:absolute;right:8px;top:10%;height:62%;width:26px;border:2px solid rgba(0,255,255,.55);border-radius:14px;background:rgba(0,0,0,.5);touch-action:none;z-index:5}
#pwrFill{position:absolute;bottom:0;left:0;right:0;height:0%;border-radius:11px;background:linear-gradient(0deg,#0f0,#ff0,#f00)}
#pwrKnob{position:absolute;left:50%;bottom:0%;transform:translate(-50%,50%);width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9ad);box-shadow:0 0 12px rgba(0,255,255,.8)}
#pwrLbl{position:absolute;right:2px;top:-22px;font-size:10px;color:#0ff;letter-spacing:2px;line-height:1.2}
#msg{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:15px;font-weight:bold;color:#ffd60a;text-shadow:0 0 12px #ff0;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .3s;line-height:1.3}
#hint{width:100%;text-align:center;font-size:12px;color:#9bd;padding:6px 4px;text-shadow:0 0 8px rgba(0,255,255,.4);line-height:1.4}
#over{position:fixed;inset:0;background:rgba(5,8,22,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;text-align:center;padding:20px}
#over h2{font-size:30px;color:#ff0;text-shadow:0 0 20px #ff0;margin-bottom:10px}
#over p{color:#aac;font-size:16px;margin:6px 0}
.bigbtn{margin-top:18px;padding:14px 44px;font-size:19px;font-weight:bold;border:none;border-radius:28px;background:linear-gradient(90deg,#0ff,#f0f);color:#050816;box-shadow:0 0 22px #f0f}
#over a{margin-top:16px;color:#0ff;text-decoration:none;font-size:15px}
#shop,#own{position:fixed;inset:0;background:rgba(5,8,22,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center;padding:20px;overflow-y:auto}
#shop h2,#own h2{font-size:26px;color:#ff0;text-shadow:0 0 16px #ff0;margin-bottom:8px}
#shop p,#own p{color:#aac;font-size:14px;margin:4px 0}
#shop h3{color:#0ff;margin:12px 0 4px;font-size:15px;text-shadow:0 0 10px #0ff}
.items{display:flex;flex-wrap:wrap;justify-content:center;max-width:420px}
.item{margin:6px;padding:10px;border:1px solid rgba(0,255,255,.3);border-radius:12px;min-width:96px;background:rgba(255,255,255,.04)}
.sw{width:46px;height:46px;border-radius:12px;margin:0 auto 6px;border:1px solid rgba(255,255,255,.3)}
.shopbtn{margin-top:6px;padding:7px 14px;font-size:13px;font-weight:bold;border:none;border-radius:16px;background:linear-gradient(90deg,#0ff,#f0f);color:#050816}
.shopbtn:disabled{background:#2a4a3a;color:#7dffc0}
.coinpop{position:fixed;top:60px;left:50%;transform:translateX(-50%);color:#ffd60a;font-weight:bold;font-size:22px;text-shadow:0 0 14px #ff0;z-index:40;animation:cp 1.3s forwards;pointer-events:none}
@keyframes cp{0%{opacity:0;transform:translateX(-50%) translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-30px)}}
#ownPin{font-size:26px;letter-spacing:10px;text-align:center;width:180px;padding:12px;border-radius:14px;border:2px solid #0ff;background:rgba(0,255,255,.06);color:#fff;margin:10px 0;outline:none}
#ownBtns{display:flex;flex-direction:column;align-items:center}
#ownKeys{display:grid;grid-template-columns:repeat(3,72px);gap:10px;margin:8px 0 12px}
#ownKeys button{font-size:26px;font-weight:bold;padding:14px 0;border-radius:14px;border:1px solid rgba(0,255,255,.45);background:rgba(255,255,255,.07);color:#0ff;touch-action:manipulation}
#ownKeys button:active{background:rgba(0,255,255,.25)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="top"><a class="home" href="index.html">🏠 HOME</a><h1 id="titleEl">8 BALL POOL</h1><span class="coinpill" id="pill">🪙 <span id="coinN">0</span></span><button class="tbtn" id="shopBtn">🛍️</button></div>
<div id="turnrow"><div id="turn">P1 • OPEN</div></div>
<div id="wrap"><canvas id="cv"></canvas>
<div id="pwr"><div id="pwrLbl">POWER</div><div id="pwrFill"></div><div id="pwrKnob"></div></div>
<div id="msg"></div></div>
<div id="hint">Table pe ungli ghumao = aim 🎯 • POWER slider neeche kheencho aur chhodo = shot</div>
<div id="over" class="hide"><h2 id="ot"></h2><p id="os"></p><button class="bigbtn" id="again">🔄 PHIR SE</button><a href="index.html">🏠 Game Hub pe wapas</a></div>
<div id="shop" class="hide"><h2>🛍️ POOL SHOP</h2><p>Tumhare paas: 🪙 <span id="shopCoins">0</span></p>
<h3>🎱 TABLE FELT</h3><div class="items" id="shopFelt"></div>
<h3>🥢 CUE STICK</h3><div class="items" id="shopCue"></div>
<button class="bigbtn" id="shopClose">✔ DONE</button></div>
<div id="own" class="hide"><h2 id="ownT">🔐</h2><p id="ownMsg"></p><input id="ownPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
<div id="ownKeys"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="b">⌫</button><button data-k="0">0</button><button data-k="c">C</button></div>
<div id="ownBtns"></div></div>
<script>
const $=id=>document.getElementById(id);
// --- galaxy sound kit (pool flavour: whoosh + laser) ---
let AC;function ac(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function beep(f,d,t='square',v=.05){if(localStorage.getItem('galaxy_muted')==='1')return;try{const a=ac();const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
function sweep(f1,f2,d,t='sine',v=.06){if(localStorage.getItem('galaxy_muted')==='1')return;try{const a=ac();const o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.setValueAtTime(f1,a.currentTime);o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);g.gain.value=v;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
function clickSnd(v){beep(2400,.03,'square',Math.min(.12,.02+v*.05))}
function railSnd(){beep(140,.08,'sine',.06)}
function pocketSnd(){sweep(700,90,.3,'sine',.12);setTimeout(()=>beep(1800,.1,'triangle',.05),200);setTimeout(()=>beep(2400,.12,'triangle',.04),320)}
function shotSnd(p){sweep(150,700+p*800,.16,'sawtooth',.1)}
function winSnd(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>sweep(f,f*1.4,.2,'triangle',.09),i*120))}
// ===== GALAXY COINS + SHOP + OWNER (shared hub system) =====
let coins=+localStorage.getItem('galaxy_coins')||0;
let ownerMode=localStorage.getItem('galaxy_owner')==='1';window.GALAXY_OWNER=ownerMode;
function getPin(){return localStorage.getItem('galaxy_pin')||'1234'}
const FELTS={green:{name:'Classic Green',price:0,c:['#178f5f','#0d5c3c']},blue:{name:'Midnight Blue',price:60,c:['#1a5f9e','#0c3a63']},red:{name:'Royal Red',price:80,c:['#a03040','#5c1622']},galaxy:{name:'Galaxy Purple',price:120,c:['#6a2bb0','#2c0f52']}};
const CUES={wood:{name:'Classic Wood',price:0,c:'#c98a3a',tip:'#0ff'},neon:{name:'Neon Cyan',price:60,c:'#0ff',tip:'#fff'},gold:{name:'Golden',price:100,c:'#ffd60a',tip:'#f0f'},magenta:{name:'Magenta Pro',price:100,c:'#f0f',tip:'#0ff'}};
let ownedSet=new Set(JSON.parse(localStorage.getItem('pool_owned')||'["t:green","c:wood"]'));
let feltSkin=localStorage.getItem('pool_felt')||'green';if(!FELTS[feltSkin])feltSkin='green';
let cueSkin=localStorage.getItem('pool_cue')||'wood';if(!CUES[cueSkin])cueSkin='wood';
let FELTC=FELTS[feltSkin].c,CUE=CUES[cueSkin];
function refreshCoins(){const t=ownerMode?'∞':coins;$('pill').innerHTML=(ownerMode?'👑 ':'🪙 ')+'<span id="coinN">'+t+'</span>';const sc=$('shopCoins');if(sc)sc.textContent=t}
refreshCoins();
function saveShop(){localStorage.setItem('galaxy_coins',coins);refreshCoins();localStorage.setItem('pool_owned',JSON.stringify([...ownedSet]));localStorage.setItem('pool_felt',feltSkin);localStorage.setItem('pool_cue',cueSkin)}
function earn(n){coins+=n;saveShop();const d=document.createElement('div');d.className='coinpop';d.textContent='+'+n+' 🪙';document.body.appendChild(d);setTimeout(()=>d.remove(),1300);beep(1500,.08,'triangle',.08);setTimeout(()=>beep(2000,.1,'triangle',.07),70)}
function renderShop(){
  refreshCoins();
  const mk=(id,def,kind)=>{
    const owned=ownedSet.has(kind+id)||ownerMode,sel=(kind==='t'?feltSkin:cueSkin)===id;
    const el=document.createElement('div');el.className='item';
    const sw=document.createElement('div');sw.className='sw';
    sw.style.background=kind==='t'?('linear-gradient(145deg,'+def.c[0]+','+def.c[1]+')'):def.c;
    el.appendChild(sw);
    const nm=document.createElement('div');nm.style.cssText='font-size:13px;font-weight:bold';nm.textContent=def.name;el.appendChild(nm);
    const b=document.createElement('button');b.className='shopbtn';
    if(sel){b.textContent='✓ LAGA HUA';b.disabled=true}
    else if(owned){b.textContent='USE KARO';b.onclick=()=>selectItem(kind,id)}
    else{b.textContent='🪙 '+def.price;b.onclick=()=>buyItem(kind,id)}
    el.appendChild(b);return el;
  };
  const sf=$('shopFelt');sf.innerHTML='';for(const id in FELTS)sf.appendChild(mk(id,FELTS[id],'t'));
  const sc2=$('shopCue');sc2.innerHTML='';for(const id in CUES)sc2.appendChild(mk(id,CUES[id],'c'));
}
function buyItem(kind,id){
  const def=(kind==='t'?FELTS:CUES)[id];
  if(!ownerMode&&coins<def.price){showMsg('Coins kam hain! Khel ke kamao 🪙');beep(180,.2,'sawtooth',.07);return}
  if(!ownerMode)coins-=def.price;ownedSet.add(kind+id);selectItem(kind,id);
  beep(1300,.1,'triangle',.09);setTimeout(()=>beep(1700,.12,'triangle',.08),90);
}
function selectItem(kind,id){
  if(kind==='t'){feltSkin=id;FELTC=FELTS[id].c}else{cueSkin=id;CUE=CUES[id]}
  saveShop();renderShop();
}
$('shopBtn').onclick=()=>{beep(600,.08,'triangle',.06);renderShop();$('shop').classList.remove('hide')};
$('shopClose').onclick=()=>{beep(500,.08,'triangle',.06);$('shop').classList.add('hide')};
// --- owner mode UI (hidden) ---
function closeOwn(){$('own').classList.add('hide')}
let ownState='enter',tapN=0,tapT=0;
$('titleEl').addEventListener('pointerdown',()=>{const n=Date.now();if(n-tapT>2500)tapN=0;tapT=n;tapN++;if(tapN>=7){tapN=0;openOwn()}});
function openOwn(){
  $('own').classList.remove('hide');beep(700,.06,'triangle',.05);
  if(ownerMode){
    ownState='panel';$('ownT').textContent='👑 OWNER MODE ON';$('ownMsg').textContent='Malik ho tum - sab free hai!';$('ownPin').classList.add('hide');$('ownKeys').classList.add('hide');
    $('ownBtns').innerHTML='<button class="bigbtn" id="ownChg">🔑 PIN BADLO</button><button class="pcbtn" id="ownOff" style="margin:8px;padding:12px 24px;font-size:15px;border-radius:20px;border:1px solid rgba(0,255,255,.4);background:rgba(255,255,255,.06);color:#0ff">OWNER MODE BAND</button><button class="pcbtn" id="ownX" style="margin:8px;padding:12px 24px;font-size:15px;border-radius:20px;border:1px solid rgba(0,255,255,.4);background:rgba(255,255,255,.06);color:#0ff">✕ CLOSE</button>';
    $('ownChg').onclick=()=>{ownState='new';$('ownT').textContent='🔑 NAYA PIN';$('ownMsg').textContent='Naya 4-digit PIN daalo';$('ownPin').classList.remove('hide');$('ownKeys').classList.remove('hide');$('ownPin').value='';$('ownBtns').innerHTML='<button class="bigbtn" id="ownOk">✔ SAVE</button>';$('ownOk').onclick=ownGo;$('ownPin').focus()};
    $('ownOff').onclick=()=>{ownerMode=false;window.GALAXY_OWNER=false;localStorage.removeItem('galaxy_owner');refreshCoins();renderShop();closeOwn();showMsg('Owner mode band');beep(300,.15,'sine',.06)};
    $('ownX').onclick=closeOwn;
  } else {
    ownState='enter';$('ownT').textContent='🔐';$('ownMsg').textContent='PIN daalo';$('ownPin').classList.remove('hide');$('ownKeys').classList.remove('hide');$('ownPin').value='';
    $('ownBtns').innerHTML='<button class="bigbtn" id="ownOk">UNLOCK</button><button class="pcbtn" id="ownX2" style="margin:8px;padding:12px 24px;font-size:15px;border-radius:20px;border:1px solid rgba(0,255,255,.4);background:rgba(255,255,255,.06);color:#0ff">✕ CLOSE</button>';
    $('ownOk').onclick=ownGo;$('ownX2').onclick=closeOwn;$('ownPin').focus();
  }
}
function ownGo(){
  const v=$('ownPin').value.trim();
  if(ownState==='enter'){
    if(v===getPin()){
      ownerMode=true;window.GALAXY_OWNER=true;localStorage.setItem('galaxy_owner','1');
      refreshCoins();renderShop();closeOwn();showMsg('👑 Owner Mode ON - sab free!');
      beep(880,.12,'triangle',.1);setTimeout(()=>beep(1320,.15,'triangle',.1),120);setTimeout(()=>beep(1760,.22,'triangle',.1),260);
    } else {$('ownMsg').textContent='Galat PIN!';$('ownPin').value='';beep(160,.25,'sawtooth',.08)}
  } else if(ownState==='new'){
    if(/^\d{4}$/.test(v)){localStorage.setItem('galaxy_pin',v);closeOwn();showMsg('🔑 PIN badal gaya');beep(1000,.12,'triangle',.09)}
    else{$('ownMsg').textContent='4 digits ka PIN daalo';$('ownPin').value=''}
  }
}
$('ownPin').addEventListener('keydown',e=>{if(e.key==='Enter')ownGo()});
$('ownKeys').addEventListener('pointerdown',e=>{const k=e.target.dataset.k;if(!k)return;e.preventDefault();beep(520,.05,'triangle',.05);const inp=$('ownPin');if(k==='b')inp.value=inp.value.slice(0,-1);else if(k==='c')inp.value='';else if(inp.value.length<4)inp.value+=k;if(inp.value.length===4&&(ownState==='enter'||ownState==='new'))setTimeout(ownGo,180)});

// --- table geometry: fits the screen exactly ---
const cv=$('cv'),ctx=cv.getContext('2d');
let W,H,DPR,RAIL,FELT,PR,BR;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  const topH=document.querySelector('.top').offsetHeight+$('turnrow').offsetHeight+$('hint').offsetHeight;
  const availH=innerHeight-topH-14;
  W=Math.min(innerWidth,430);
  RAIL=Math.round(W*.075);
  H=2*(W-2*RAIL)+2*RAIL;
  if(H>availH){W=Math.floor((availH)/1.85);RAIL=Math.round(W*.075);H=Math.min(availH,2*(W-2*RAIL)+2*RAIL)}
  cv.style.width=W+'px';cv.style.height=H+'px';cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  FELT={x:RAIL,y:RAIL,w:W-2*RAIL,h:H-2*RAIL};
  PR=FELT.w*.062;BR=FELT.w/19;
  placeAll();
}
// --- balls ---
const BCOL={1:'#ffd60a',2:'#2e6bff',3:'#ff3b5c',4:'#a04dff',5:'#ff8a00',6:'#0aa04e',7:'#8a3b1e',8:'#15151f',9:'#ffd60a',10:'#2e6bff',11:'#ff3b5c',12:'#a04dff',13:'#ff8a00',14:'#0aa04e',15:'#8a3b1e'};
let balls,cue;
function rack(){
  balls=[];cue={n:0,x:FELT.x+FELT.w/2,y:FELT.y+FELT.h*.22,vx:0,vy:0,on:true};
  const order=[1,9,2,10,8,3,11,4,12,5,13,6,14,7,15];
  let k=0;const ax=FELT.x+FELT.w/2,ay=FELT.y+FELT.h*.72,gap=BR*2+1;
  for(let r=0;r<5;r++)for(let i=0;i<=r;i++)balls.push({n:order[k++],x:ax+(i-r/2)*gap,y:ay+r*gap*.9,vx:0,vy:0,on:true});
}
let firstLayout=true;
function placeAll(){if(firstLayout){firstLayout=false;return}}
// --- game state ---
let turn=0,groups=[null,null],pottedBy=[[],[]];
let phase='aim',aimAng=Math.PI/2,aiming=false,power=0,charging=false;
let shotPotted=[],shotCue=false,shotFirst=null;
const pname=i=>'P'+(i+1);
function grpOf(n){return n===8?'eight':n<8?'solid':'stripe'}
function turnTxt(){
  const g=groups[turn]?groups[turn]==='solid'?'SOLID ●':'STRIPE ◐':'OPEN';
  $('turn').textContent=pname(turn)+' • '+g;
  $('turn').style.borderColor=turn?'#f0f':'#0ff';$('turn').style.color=turn?'#f0f':'#0ff';
}
function showMsg(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(showMsg.t);showMsg.t=setTimeout(()=>m.style.opacity=0,1800)}
// --- input: drag on table = aim, side slider = power, release slider = shot ---
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(phase!=='aim'||!cue.on)return;aiming=true;const p=pt(e);aimAng=Math.atan2(p.y-cue.y,p.x-cue.x)});
cv.addEventListener('pointermove',e=>{if(!aiming||phase!=='aim')return;const p=pt(e);const d=Math.hypot(p.x-cue.x,p.y-cue.y);if(d>BR*.5)aimAng=Math.atan2(p.y-cue.y,p.x-cue.x)});
addEventListener('pointerup',()=>{aiming=false});
const pwr=$('pwr');
function setPower(e){
  const r=pwr.getBoundingClientRect();
  power=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));
  $('pwrFill').style.height=(power*100)+'%';
  $('pwrKnob').style.bottom=(power*100)+'%';
}
pwr.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(phase!=='aim'||!cue.on)return;charging=true;setPower(e)});
addEventListener('pointermove',e=>{if(charging)setPower(e)});
addEventListener('pointerup',e=>{
  if(!charging)return;charging=false;
  if(phase==='aim'&&cue.on&&power>.04){
    const v=power*24;
    cue.vx=Math.cos(aimAng)*v;cue.vy=Math.sin(aimAng)*v;
    phase='moving';shotPotted=[];shotCue=false;shotFirst=null;shotSnd(power);
  }
  power=0;$('pwrFill').style.height='0%';$('pwrKnob').style.bottom='0%';
});
// --- physics ---
function pockets(){
  const {x,y,w,h}=FELT;
  return[{x,y},{x:x+w/2,y},{x:x+w,y},{x,y:y+h},{x:x+w/2,y:y+h},{x:x+w,y:y+h}];
}
function step(){
  const all=[cue,...balls];
  for(const b of all){
    if(!b.on)continue;
    b.x+=b.vx;b.y+=b.vy;
    b.vx*=.986;b.vy*=.986;
    if(Math.hypot(b.vx,b.vy)<.03){b.vx=0;b.vy=0}
    if(b.x<FELT.x+BR){b.x=FELT.x+BR;b.vx=-b.vx*.82;railSnd()}
    if(b.x>FELT.x+FELT.w-BR){b.x=FELT.x+FELT.w-BR;b.vx=-b.vx*.82;railSnd()}
    if(b.y<FELT.y+BR){b.y=FELT.y+BR;b.vy=-b.vy*.82;railSnd()}
    if(b.y>FELT.y+FELT.h-BR){b.y=FELT.y+FELT.h-BR;b.vy=-b.vy*.82;railSnd()}
  }
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],b=all[j];if(!a.on||!b.on)continue;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d>0&&d<BR*2){
      const nx=dx/d,ny=dy/d,ov=(BR*2-d)/2;
      a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
      const avn=a.vx*nx+a.vy*ny,bvn=b.vx*nx+b.vy*ny,dv=avn-bvn;
      if(dv>0){
        a.vx-=dv*nx;a.vy-=dv*ny;b.vx+=dv*nx;b.vy+=dv*ny;
        if((a===cue||b===cue)&&!shotFirst)shotFirst=a===cue?b.n:a.n;
        clickSnd(Math.min(1,dv/12));
      }
    }
  }
  for(const p of pockets())for(const b of all){
    if(!b.on)continue;
    if(Math.hypot(b.x-p.x,b.y-p.y)<PR*.92){
      b.on=false;b.vx=b.vy=0;pocketSnd();
      if(b===cue)shotCue=true;else shotPotted.push(b.n);
    }
  }
}
function anyMoving(){if(cue.on&&(cue.vx||cue.vy))return true;return balls.some(b=>b.on&&(b.vx||b.vy))}
function resolveShot(){
  const me=turn,opp=1-turn;
  let stay=false,foul=false;
  const mine=shotPotted.filter(n=>grpOf(n)==='solid'||grpOf(n)==='stripe');
  if(!groups[0]&&mine.length){
    groups[me]=grpOf(mine[0]);groups[opp]=groups[me]==='solid'?'stripe':'solid';
    showMsg(pname(me)+' = '+(groups[me]==='solid'?'SOLID ●':'STRIPE ◐'));
  }
  if(shotPotted.includes(8)){
    if(left(me)===0&&groups[me])gameOver(me,pname(me)+' ne 8 ball daal ke jeeta! 🏆');
    else gameOver(opp,pname(me)+' ne 8 ball jaldi gira di! '+pname(opp)+' jeeta 🏆');
    return;
  }
  for(const n of shotPotted){
    const g=grpOf(n);
    if(groups[me]&&g===groups[me]){pottedBy[me].push(n);stay=true;earn(2)}
    else if(groups[opp]&&g===groups[opp]){pottedBy[opp].push(n)}
    else if(g!=='eight'){pottedBy[me].push(n);stay=true;earn(2)}
  }
  if(shotCue){foul=true;showMsg('Foul! Cue gir gaya 😅');respawnCue()}
  else if(!shotFirst){foul=true;showMsg('Foul! Koi ball touch nahi hui')}
  else if(groups[me]&&grpOf(shotFirst)!==groups[me]&&grpOf(shotFirst)!=='eight'){foul=true;showMsg('Foul! Galat ball pehle chhui')}
  else if(groups[me]&&grpOf(shotFirst)==='eight'&&left(me)>0){foul=true;showMsg('Foul! 8 ball abhi nahi')}
  if(foul||!stay)turn=opp;
  turnTxt();
}
function left(p){const g=groups[p];if(!g)return 7;return balls.filter(b=>b.on&&grpOf(b.n)===g).length}
function respawnCue(){
  cue.on=true;cue.vx=cue.vy=0;
  const cx=FELT.x+FELT.w/2;let cy=FELT.y+FELT.h*.22;
  while(balls.some(b=>b.on&&Math.hypot(b.x-cx,b.y-cy)<BR*2.2)){cy+=BR*2.3;if(cy>FELT.y+FELT.h-BR)break}
  cue.x=cx;cue.y=Math.min(cy,FELT.y+FELT.h-BR);
}
function gameOver(w,t){
  phase='over';winSnd();earn(20);
  $('ot').textContent='🏆 '+pname(w)+' WINS!';$('os').textContent=t;
  $('over').classList.remove('hide');
}
$('again').onclick=()=>{$('over').classList.add('hide');firstLayout=true;resize();rack();turn=0;groups=[null,null];pottedBy=[[],[]];phase='aim';aimAng=Math.PI/2;turnTxt()};
// --- aim guide: ghost ball + deflection lines ---
function castRay(){
  const ux=Math.cos(aimAng),uy=Math.sin(aimAng);
  let bestT=Infinity,hit=null;
  for(const b of balls){
    if(!b.on)continue;
    const dx=b.x-cue.x,dy=b.y-cue.y;
    const proj=dx*ux+dy*uy;if(proj<=0)continue;
    const perp2=dx*dx+dy*dy-proj*proj,rr=BR*2*BR*2;
    if(perp2>rr)continue;
    const t=proj-Math.sqrt(rr-perp2);
    if(t<bestT){bestT=t;hit=b}
  }
  let wallT=Infinity;
  if(ux>0)wallT=Math.min(wallT,(FELT.x+FELT.w-BR-cue.x)/ux);
  if(ux<0)wallT=Math.min(wallT,(FELT.x+BR-cue.x)/ux);
  if(uy>0)wallT=Math.min(wallT,(FELT.y+FELT.h-BR-cue.y)/uy);
  if(uy<0)wallT=Math.min(wallT,(FELT.y+BR-cue.y)/uy);
  if(wallT<bestT){bestT=wallT;hit=null}
  return{t:bestT,ball:hit};
}
// --- draw ---
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawBall(b){
  if(!b.on)return;
  const g=ctx.createRadialGradient(b.x-BR*.4,b.y-BR*.4,BR*.15,b.x,b.y,BR);
  if(b.n===0){g.addColorStop(0,'#fff');g.addColorStop(1,'#c8cfe8')}
  else{g.addColorStop(0,'#fff');g.addColorStop(.25,BCOL[b.n]);g.addColorStop(1,BCOL[b.n])}
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,BR,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;ctx.stroke();
  if(b.n>8){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,BR*.55,0,7);ctx.fill()}
  if(b.n>0){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,BR*.44,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.font='bold '+Math.round(BR*.72)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.n,b.x,b.y+.5);
  }
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(b.x-BR*.35,b.y-BR*.4,BR*.16,0,7);ctx.fill();
}
function draw(){
  ctx.fillStyle='#0a0f24';ctx.fillRect(0,0,W,H);
  const rg=ctx.createLinearGradient(0,0,W,H);rg.addColorStop(0,'#123a2e');rg.addColorStop(1,'#0b2a20');
  roundRect(0,0,W,H,12);ctx.fillStyle=rg;ctx.fill();
  const fg=ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,H*.6);fg.addColorStop(0,FELTC[0]);fg.addColorStop(1,FELTC[1]);
  roundRect(FELT.x,FELT.y,FELT.w,FELT.h,8);ctx.fillStyle=fg;ctx.fill();
  ctx.strokeStyle='rgba(0,255,200,.25)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.35)';
  for(const f of[.25,.5,.75]){ctx.beginPath();ctx.arc(FELT.x+FELT.w*f,FELT.y-6,2.2,0,7);ctx.fill();ctx.beginPath();ctx.arc(FELT.x+FELT.w*f,FELT.y+FELT.h+6,2.2,0,7);ctx.fill()}
  for(const f of[.25,.5,.75]){ctx.beginPath();ctx.arc(FELT.x-6,FELT.y+FELT.h*f,2.2,0,7);ctx.fill();ctx.beginPath();ctx.arc(FELT.x+FELT.w+6,FELT.y+FELT.h*f,2.2,0,7);ctx.fill()}
  for(const p of pockets()){
    const pg=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,PR);
    pg.addColorStop(0,'#000');pg.addColorStop(.75,'#02040a');pg.addColorStop(1,'rgba(0,255,255,.18)');
    ctx.fillStyle=pg;ctx.beginPath();ctx.arc(p.x,p.y,PR,0,7);ctx.fill();
    ctx.strokeStyle='rgba(0,255,255,.3)';ctx.lineWidth=1.5;ctx.stroke();
  }
  // aim guide
  if(phase==='aim'&&cue.on){
    const {t,ball}=castRay();
    const gx=cue.x+Math.cos(aimAng)*t,gy=cue.y+Math.sin(aimAng)*t;
    ctx.setLineDash([7,7]);ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cue.x+Math.cos(aimAng)*BR,cue.y+Math.sin(aimAng)*BR);ctx.lineTo(gx,gy);ctx.stroke();ctx.setLineDash([]);
    // ghost ball at contact
    ctx.strokeStyle='rgba(255,255,255,.75)';ctx.setLineDash([3,4]);ctx.beginPath();ctx.arc(gx,gy,BR,0,7);ctx.stroke();ctx.setLineDash([]);
    if(ball){
      // target ball direction
      let tx=ball.x-gx,ty=ball.y-gy;const tl=Math.hypot(tx,ty);tx/=tl;ty/=tl;
      ctx.strokeStyle='rgba(255,220,80,.95)';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(ball.x,ball.y);ctx.lineTo(ball.x+tx*BR*3.2,ball.y+ty*BR*3.2);ctx.stroke();
      // cue ball deflection (tangent)
      const dxu=-ty,dyu=tx;
      ctx.strokeStyle='rgba(0,255,255,.8)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx+dxu*BR*2,gy+dyu*BR*2);ctx.stroke();
    }
    // cue stick attached behind cue ball, pulls back with power
    const ux=Math.cos(aimAng),uy=Math.sin(aimAng),pull=BR+6+power*44;
    ctx.lineCap='round';
    ctx.strokeStyle=CUE.c;ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(cue.x-ux*pull,cue.y-uy*pull);ctx.lineTo(cue.x-ux*(pull+120),cue.y-uy*(pull+120));ctx.stroke();
    ctx.strokeStyle=CUE.tip;ctx.lineWidth=7;
    ctx.beginPath();ctx.moveTo(cue.x-ux*pull,cue.y-uy*pull);ctx.lineTo(cue.x-ux*(pull+11),cue.y-uy*(pull+11));ctx.stroke();
  }
  for(const b of balls)drawBall(b);
  drawBall(cue);
  ctx.font='bold 12px Arial';ctx.textBaseline='middle';
  ctx.fillStyle='#0ff';ctx.textAlign='left';ctx.fillText('P1: '+pottedBy[0].join(' '),FELT.x+4,FELT.y+FELT.h+15);
  ctx.fillStyle='#f0f';ctx.textAlign='right';ctx.fillText('P2: '+pottedBy[1].join(' '),FELT.x+FELT.w-4,FELT.y-13);
}
// --- loop ---
function loop(){
  if(phase==='moving'){
    for(let i=0;i<3;i++)step();
    if(!anyMoving()){resolveShot();if(phase==='moving')phase='aim'}
  }
  draw();
  requestAnimationFrame(loop);
}
resize();rack();turnTxt();loop();
addEventListener('resize',()=>{const ox=FELT.x,oy=FELT.y,ow=FELT.w,oh=FELT.h;const all=[cue,...balls].filter(b=>b.on).map(b=>({b,fx:(b.x-ox)/ow,fy:(b.y-oy)/oh}));resize();for(const o of all){o.b.x=FELT.x+o.fx*FELT.w;o.b.y=FELT.y+o.fy*FELT.h}});
// ===== GALAXY MUSIC + MUTE =====
(function(){
  const CFG={root:164.81,notes:[0, 3, 7, 10, 14, 12, 10, 7],wave:'triangle',tempo:115,ambient:true};
  let played=false,gctx=null;
  const gmuted=()=>localStorage.getItem('galaxy_muted')==='1';
  function play(){
    if(played)return;played=true;
    if(gmuted())return;
    try{
      const a=new(window.AudioContext||window.webkitAudioContext)();if(a.state==='suspended')a.resume();gctx=a;
      const master=a.createGain();master.gain.value=.95;master.connect(a.destination);
      const t0=a.currentTime+.05;
      [0,7,12].forEach(iv=>{
        const f=CFG.root/2*Math.pow(2,iv/12);
        const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(.06,t0+1.1);g.gain.exponentialRampToValueAtTime(.0001,t0+3.4);
        o.connect(g);g.connect(master);o.start(t0);o.stop(t0+3.5);
      });
      CFG.notes.forEach((n,i)=>{
        const f=CFG.root*Math.pow(2,n/12),t=t0+.25+i*(60/CFG.tempo);
        const o=a.createOscillator(),g=a.createGain();o.type=CFG.wave;o.frequency.value=f;
        g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.13,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.36);
        o.connect(g);g.connect(master);o.start(t);o.stop(t+.42);
      });
      const end=.25+CFG.notes.length*(60/CFG.tempo)+.3;
      const s=a.createOscillator(),sg=a.createGain();s.type='triangle';s.frequency.value=CFG.root*4;
      sg.gain.setValueAtTime(.0001,t0+end);sg.gain.linearRampToValueAtTime(.06,t0+end+.08);sg.gain.exponentialRampToValueAtTime(.0001,t0+end+1.5);
      s.connect(sg);sg.connect(master);s.start(t0+end);s.stop(t0+end+1.6);
      if(CFG.ambient){
        const ts=t0+end+.5;
        [0,7,12,16].forEach((iv,i)=>{
          const f=CFG.root/2*Math.pow(2,iv/12);
          const o=a.createOscillator(),g=a.createGain();o.type=i%2?'sine':'triangle';o.frequency.value=f;
          g.gain.setValueAtTime(.0001,ts);g.gain.linearRampToValueAtTime(.024,ts+4);g.gain.setValueAtTime(.024,ts+15);g.gain.exponentialRampToValueAtTime(.0001,ts+24);
          o.connect(g);g.connect(master);o.start(ts);o.stop(ts+25);
        });
      }
    }catch(e){}
  }
  addEventListener('pointerdown',play,{once:true});
  const mb=document.createElement('button');mb.id='gmute';mb.title='Sound on/off';
  mb.setAttribute('style','position:fixed;right:10px;bottom:12px;z-index:90;width:42px;height:42px;border-radius:50%;background:rgba(5,8,22,.78);border:1px solid rgba(0,255,255,.45);font-size:19px;padding:0;box-shadow:0 0 10px rgba(0,255,255,.25);cursor:pointer');
  function paint(){mb.textContent=gmuted()?'\u{1F507}':'\u{1F50A}'}
  paint();
  mb.addEventListener('click',e=>{e.stopPropagation();localStorage.setItem('galaxy_muted',gmuted()?'0':'1');paint();if(gctx){gmuted()?gctx.suspend():gctx.resume()}});
  document.body.appendChild(mb);
})();

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
<script>addEventListener('load',()=>{const mb=document.getElementById('gmute'),top=document.querySelector('.top');if(mb&&top){mb.style.cssText='position:static;width:30px;height:30px;border-radius:50%;background:rgba(0,255,255,.08);border:1px solid rgba(0,255,255,.45);font-size:14px;padding:0;margin-left:6px;flex-shrink:0;box-shadow:none;cursor:pointer';top.appendChild(mb)}});</script>
