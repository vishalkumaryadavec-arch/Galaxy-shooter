<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Galaxy AI Cricket 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b12;font-family:Arial,Helvetica,sans-serif;color:#fff}
#app{position:fixed;inset:0}#game{position:absolute;inset:0}
canvas{display:block}
.hud{position:absolute;z-index:5;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:10px;gap:8px}
.scoreboard{min-width:270px;background:linear-gradient(135deg,#071522ee,#102d46ee);border:1px solid #5a8eaf;border-radius:13px;padding:8px 12px;box-shadow:0 8px 30px #0008}
.team{font-size:11px;color:#70c8ff;letter-spacing:1px}.score{font-size:30px;font-weight:900}.score small{font-size:13px;color:#9fb4c4}.target{font-size:11px;color:#b7c8d2}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{background:#091b2acc;border:1px solid #39617a;border-radius:9px;padding:7px 9px;font-size:11px}
.centerInfo{position:absolute;top:13px;left:50%;transform:translateX(-50%);text-align:center;background:#071522cc;border:1px solid #385e74;border-radius:10px;padding:6px 13px;font-size:12px}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:10px;display:flex;justify-content:space-between;align-items:end;gap:10px}
.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(620px,100%)}
button{pointer-events:auto;border:1px solid #4f7992;border-radius:10px;background:linear-gradient(#123e5e,#0a2439);color:#fff;padding:11px 6px;font-size:11px;font-weight:900;box-shadow:0 4px 12px #0008}
button:active{transform:scale(.96)}button.accent{border-color:#f3b932;background:linear-gradient(#7a5410,#3a2607)}
.status{width:260px;background:#071522dd;border:1px solid #35586e;border-radius:12px;padding:9px;pointer-events:none}
.status b{color:#ffd34d}.meter{height:9px;margin-top:7px;background:#172b36;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#e33,#ffd34e,#35d06f,#ffd34e,#e33)}
.toast{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);font-size:27px;font-weight:900;text-shadow:0 3px 10px #000;opacity:0;transition:.2s;text-align:center}
.toast.show{opacity:1}.help{position:absolute;top:92px;left:50%;transform:translateX(-50%);font-size:10px;color:#b7c8d2;background:#071522aa;padding:5px 9px;border-radius:8px}
@media(max-width:700px){.scoreboard{min-width:190px}.score{font-size:23px}.badges{display:none}.centerInfo{display:none}.status{width:170px;font-size:10px}.controls{grid-template-columns:repeat(3,1fr)}.bottom{align-items:end}.help{top:76px}.toast{font-size:21px}}
</style>
</head>
<body>
<div id="app"><div id="game"></div>
<div class="hud">
  <div class="top">
    <div class="scoreboard">
      <div class="team">🇮🇳 INDIA • T20 MATCH</div>
      <div class="score"><span id="runs">0</span>/<span id="wkts">0</span> <small>(<span id="overs">0.0</span>)</small></div>
      <div class="target">TARGET 121 • RR <span id="rr">0.00</span> • THIS OVER <span id="thisOver">0</span></div>
    </div>
    <div class="badges"><div class="badge">🏟️ NIGHT STADIUM</div><div class="badge">🎥 BROADCAST CAM</div><div class="badge">☁️ CLEAR</div></div>
  </div>
  <div class="centerInfo">INDIA vs GALAXY XI &nbsp; • &nbsp; <span id="delivery">READY</span></div>
  <div class="help">Keyboard: 1 Defence · 2 Drive · 3 Pull · 4 Cut · 5 Loft · Space Swing · N Next Ball</div>
  <div id="toast" class="toast"></div>
  <div class="bottom">
    <div class="controls">
      <button onclick="bat('defence')">DEFENCE</button>
      <button onclick="bat('drive')">DRIVE</button>
      <button onclick="bat('pull')">PULL</button>
      <button onclick="bat('cut')">CUT</button>
      <button class="accent" onclick="bat('loft')">LOFT</button>
      <button onclick="bowl('fast')">FAST BOWL</button>
      <button onclick="bowl('swing')">SWING</button>
      <button onclick="bowl('spin')">SPIN</button>
      <button onclick="nextBall()">NEXT BALL</button>
      <button onclick="newMatch()">NEW MATCH</button>
    </div>
    <div class="status">
      <b id="message">Ready for the next delivery.</b>
      <div class="meter"><div id="bar" class="bar"></div></div>
      <div style="margin-top:5px">Timing: <span id="timing">WAIT</span> • Bowler: <span id="bowler">FAST</span></div>
    </div>
  </div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
'use strict';

let scene,camera,renderer,clock;
let ball,batsman,bowler,batMesh,keeper;
let phase='ready',deliveryT=0,resultT=0,selectedShot='',bowling='fast';
let runs=0,wickets=0,balls=0,overRuns=0,target=121;
const $=id=>document.getElementById(id);

function makeMat(color,rough=.65,metal=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal})}
function box(w,h,d,color){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),makeMat(color))}
function sphere(r,color){return new THREE.Mesh(new THREE.SphereGeometry(r,24,16),makeMat(color,.55))}
function cyl(r,h,color){return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),makeMat(color))}

function createPlayer(teamColor, x,z, isKeeper=false){
 const g=new THREE.Group();
 const torso=box(.65,1.05,.38,teamColor); torso.position.y=1.65; g.add(torso);
 const head=sphere(.27,0xc98b68);head.position.y=2.45;g.add(head);
 const pants=box(.68,.65,.4,0xe9e9e9);pants.position.y=.8;g.add(pants);
 const leg1=box(.18,.72,.2,0x202832),leg2=leg1.clone();leg1.position.set(-.18,.25,0);leg2.position.set(.18,.25,0);g.add(leg1,leg2);
 const shoe1=box(.23,.12,.4,0x11151a),shoe2=shoe1.clone();shoe1.position.set(-.18,-.15,-.04);shoe2.position.set(.18,-.15,-.04);g.add(shoe1,shoe2);
 if(isKeeper){
  const gloves=sphere(.14,0xf2f2f2);gloves.position.set(-.48,1.55,.02);g.add(gloves,gloves.clone());
  const helmet=sphere(.31,0x163e65);helmet.scale.y=.65;helmet.position.y=2.48;g.add(helmet);
 }
 g.position.set(x,0,z);scene.add(g);return g;
}

function init(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x061321);scene.fog=new THREE.Fog(0x061321,35,85);
 camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,150);
 camera.position.set(0,8,17);camera.lookAt(0,1,0);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
 document.getElementById('game').appendChild(renderer.domElement);
 clock=new THREE.Clock();

 scene.add(new THREE.HemisphereLight(0xbfdfff,0x163c22,2.0));
 const sun=new THREE.DirectionalLight(0xffffff,3.1);sun.position.set(-10,18,8);sun.castShadow=true;scene.add(sun);
 for(let i=0;i<4;i++){let l=new THREE.PointLight(0xddeeff,7,30);l.position.set((i<2?-1:1)*17,14,(i%2?-18:18));scene.add(l)}

 // ground and pitch
 const ground=new THREE.Mesh(new THREE.CircleGeometry(32,64),makeMat(0x1d783c));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
 const pitch=new THREE.Mesh(new THREE.BoxGeometry(3.05,.05,20.12),makeMat(0xb89567));pitch.position.y=.025;scene.add(pitch);
 const inner=new THREE.Mesh(new THREE.RingGeometry(27,27.15,64),new THREE.MeshBasicMaterial({color:0xe8e8e8,side:THREE.DoubleSide}));inner.rotation.x=-Math.PI/2;inner.position.y=.04;scene.add(inner);

 // creases and stumps
 for(const z of [-8.9,8.9]){
  const line=new THREE.Mesh(new THREE.BoxGeometry(3.7,.025,.04),makeMat(0xffffff));line.position.set(0,.07,z);scene.add(line);
  for(let i=-1;i<=1;i++){let s=cyl(.035,.75,0xe9bd54);s.position.set(i*.12,.42,z);scene.add(s)}
 }
 // stands
 for(let i=0;i<18;i++){let s=box(2.2,1.4,.7,0x152b3b);s.position.set((i%2?1:-1)*(15+(i%5)*2),.7,-22+i*2.7);scene.add(s)}
 // floodlight towers
 for(const x of [-18,18])for(const z of [-18,18]){let pole=cyl(.12,12,0x59636b);pole.position.set(x,6,z);scene.add(pole);let lamp=box(1.2,.7,.4,0xf2f4df);lamp.position.set(x,12,z);scene.add(lamp)}

 batsman=createPlayer(0x1a5ec9,0,7.6,false);
 bowler=createPlayer(0xc73434,0,-7.2,false);
 keeper=createPlayer(0x173f69,0,9.4,true);
 batsman.rotation.y=Math.PI;
 bowler.rotation.y=0;keeper.rotation.y=Math.PI;
 batMesh=box(.12,2.0,.28,0xc99656);batMesh.position.set(.62,1.25,7.25);batMesh.rotation.z=-.32;scene.add(batMesh);
 ball=sphere(.12,0xd71920);ball.position.set(0,2,-7);ball.castShadow=true;scene.add(ball);
 window.addEventListener('resize',resize);
 newMatch();animate();
}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function setMsg(s){$('message').textContent=s}
function updateHud(){
 $('runs').textContent=runs;$('wkts').textContent=wickets;$('overs').textContent=Math.floor(balls/6)+'.'+balls%6;
 $('rr').textContent=balls?((runs/(balls/6)).toFixed(2)):'0.00';$('thisOver').textContent=overRuns;
}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),850)}
function nextBall(){
 if(phase==='delivery')return;
 if(balls>=120){setMsg('Innings complete. Start a new match.');return}
 phase='delivery';deliveryT=0;resultT=0;selectedShot='';
 $('delivery').textContent='DELIVERY';setMsg('Watch the ball and select a shot at the right time.');$('timing').textContent='WAIT';$('bar').style.width='0%';
}
function bowl(type){bowling=type;$('bowler').textContent=type.toUpperCase();setMsg('Bowling type selected: '+type.toUpperCase());if(phase!=='delivery')nextBall()}
function bat(s){
 if(phase!=='delivery'){setMsg('Tap NEXT BALL first.');return}
 selectedShot=s;phase='result';resultT=0;
 const d=Math.abs(deliveryT-.76);let r=0,quality='';
 if(d<.055){r=(s==='pull'||s==='loft')?6:(s==='defence'?1:4);quality='PERFECT';}
 else if(d<.14){r=s==='defence'?0:2;quality='GOOD';}
 else{quality='MISS';if(Math.random()<.17){wickets++;r=0}else r=1}
 runs+=r;overRuns+=r;balls++;
 if(r===6){toast('SIX!');setMsg(quality+' TIMING • SIX!')}
 else if(r===4){toast('FOUR!');setMsg(quality+' TIMING • FOUR!')}
 else if(wickets && r===0){toast('WICKET!');setMsg('WICKET • '+balls+' balls')}
 else setMsg(quality+' TIMING • '+r+' run'+(r===1?'':'s'));
 updateHud();$('timing').textContent=quality;
 if(balls%6===0){setTimeout(()=>{overRuns=0;setMsg('OVER COMPLETE • Choose NEXT BALL for the new over.')},550)}
}
function newMatch(){runs=0;wickets=0;balls=0;overRuns=0;phase='ready';deliveryT=0;updateHud();setMsg('Ready. Tap NEXT BALL.');$('delivery').textContent='READY'}
window.addEventListener('keydown',e=>{
 if(e.key==='1')bat('defence');if(e.key==='2')bat('drive');if(e.key==='3')bat('pull');if(e.key==='4')bat('cut');if(e.key==='5')bat('loft');
 if(e.code==='Space'){e.preventDefault();bat('drive')}if(e.key.toLowerCase()==='n')nextBall();
});

function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.035);
 if(phase==='delivery'){
  deliveryT=Math.min(1,deliveryT+dt*(bowling==='fast'?1.18:bowling==='swing'?1.02:.86));
  const z=-7+deliveryT*14.2;ball.position.set(Math.sin(deliveryT*12)*.12,1.65+Math.sin(deliveryT*Math.PI)*.42,z);
  bowler.rotation.x=Math.sin(deliveryT*Math.PI)*.7;
  $('bar').style.width=(deliveryT*100)+'%';
  if(deliveryT>=1){bat('defence')}
 }else if(phase==='result'){
  resultT+=dt;let speed=selectedShot==='loft'?9:6;ball.position.x=selectedShot==='cut'?Math.min(18,resultT*speed):selectedShot==='pull'?Math.min(13,resultT*speed):Math.sin(resultT*3)*.5;
  ball.position.y=1.5+Math.sin(Math.min(resultT,1.3)*Math.PI)*4+resultT*1.5;
  ball.position.z=7.2-resultT*8;
  batMesh.rotation.z=-.32+Math.sin(Math.min(resultT*8,Math.PI))*1.0;
  if(resultT>1.25){phase='ready';$('delivery').textContent='READY'}
 }else{
  batMesh.rotation.z=-.32+Math.sin(performance.now()/900)*.035;
  ball.position.y=1.7+Math.sin(performance.now()/350)*.03;
 }
 batsman.position.x=Math.sin(performance.now()/1800)*.08;
 renderer.render(scene,camera);
}
init();
</script>
</body>
</html>
