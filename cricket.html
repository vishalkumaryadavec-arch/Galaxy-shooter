<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cricket Champions - GALAXY AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#06101c;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
.wrap{max-width:1200px;margin:auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#0c2844,#10203b);padding:12px 15px;border:1px solid #2b5b82;border-radius:15px;margin-bottom:10px}
.logo{font-size:20px;font-weight:900}.logo small{display:block;color:#65c5ff;font-size:10px;letter-spacing:3px}
.score{font-size:28px;font-weight:900}.score small{font-size:13px;color:#9cb5c8}
.card{background:#091a2b;border:1px solid #28516f;border-radius:15px;padding:9px;box-shadow:0 10px 30px #0008}
canvas{width:100%;display:block;border-radius:11px;background:#153447;touch-action:none}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
button{border:1px solid #3d7195;background:linear-gradient(#164b70,#0c304b);color:white;border-radius:10px;padding:12px 5px;font-weight:900;font-size:12px;cursor:pointer}
button:active{transform:scale(.97)}
.info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px}
.box{background:#0d2337;border:1px solid #214a68;border-radius:10px;padding:10px}
.box b{color:#ffd34e}.message{font-size:13px;line-height:1.4;color:#bdd0dd}
.meter{height:14px;border-radius:20px;background:#1d2d39;overflow:hidden;margin-top:6px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#e33,#ffd34e,#35d06f,#ffd34e,#e33)}
@media(max-width:650px){.controls{grid-template-columns:repeat(2,1fr)}.info{grid-template-columns:1fr}.score{font-size:23px}.logo{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><small>GALAXY AI • GAME HUB</small>🏏 CRICKET CHAMPIONS</div>
    <div class="score"><span id="sc">0</span>/<span id="wk">0</span> <small>(<span id="ov">0.0</span>)</small></div>
  </div>

  <div class="card">
    <canvas id="game" width="1100" height="620"></canvas>
    <div class="controls">
      <button onclick="shot('defence')">🛡️ DEFENCE</button>
      <button onclick="shot('drive')">🏏 DRIVE</button>
      <button onclick="shot('pull')">💥 PULL</button>
      <button onclick="shot('cut')">⚡ CUT</button>
      <button onclick="shot('sweep')">🔄 SWEEP</button>
      <button onclick="shot('loft')">🚀 LOFT</button>
      <button onclick="startBall()">🎳 NEXT BALL</button>
      <button onclick="newGame()">🔄 NEW MATCH</button>
    </div>
    <div class="info">
      <div class="box"><b>PLAYER</b><br>🇮🇳 Galaxy Batsman<br>OVR 78</div>
      <div class="box"><b>MATCH</b><br>India vs Galaxy XI<br>Target: 121</div>
      <div class="box"><b>STATUS</b><br><span id="msg">Tap NEXT BALL to start.</span><div class="meter"><div id="bar" class="bar"></div></div></div>
    </div>
  </div>
</div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let score=0,wickets=0,balls=0,phase='idle',t=0,shotName='',result=0,started=false;

function update(){
 document.getElementById('sc').textContent=score;
 document.getElementById('wk').textContent=wickets;
 document.getElementById('ov').textContent=Math.floor(balls/6)+'.'+balls%6;
}
function text(s){document.getElementById('msg').textContent=s}
function newGame(){score=0;wickets=0;balls=0;phase='idle';t=0;result=0;update();text('New match ready. Tap NEXT BALL.')}
function startBall(){
 if(phase==='delivery')return;
 phase='delivery';t=0;result=0;shotName='';
 text('Ball coming... choose your shot at the right time!');
}
function shot(s){
 if(phase!=='delivery'){text('Tap NEXT BALL first.');return}
 shotName=s;phase='result';result=0;
 let d=Math.abs(t-.72),runs=0;
 if(d<.055){
   runs=s==='defence'?1:(s==='pull'||s==='loft'?6:(s==='sweep'?4:4));
   text('🔥 PERFECT TIMING! '+runs+' run'+(runs===1?'':'s')+'!');
 }else if(d<.14){
   runs=s==='defence'?0:2;
   text('👍 GOOD TIMING — '+runs+' run'+(runs===1?'':'s')+'.');
 }else{
   if(Math.random()<.18){wickets++;text('💥 WICKET! Miss-timed shot.')}
   else{runs=1;text('😅 Miss-timed — 1 run.')}
 }
 score+=runs;balls++;update();
}
window.addEventListener('keydown',e=>{
 if(e.key==='1')shot('defence');if(e.key==='2')shot('drive');if(e.key==='3')shot('pull');if(e.key==='4')shot('cut');
 if(e.code==='Space'){e.preventDefault();shot('drive')}if(e.key.toLowerCase()==='n')startBall();
});

function stadium(){
 let g=ctx.createLinearGradient(0,0,0,350);g.addColorStop(0,'#06172c');g.addColorStop(1,'#24617a');
 ctx.fillStyle=g;ctx.fillRect(0,0,c.width,350);
 for(let i=0;i<80;i++){ctx.fillStyle=i%2?'#17384b':'#20485a';ctx.fillRect(i*15,150+(i%4)*9,11,42)}
 for(let i=0;i<12;i++){ctx.fillStyle='#fff4bd';ctx.beginPath();ctx.arc(55+i*90,70+(i%2)*10,4,0,7);ctx.fill()}
 ctx.fillStyle='#2d9149';ctx.fillRect(0,320,c.width,300);
 for(let y=340;y<620;y+=34){ctx.strokeStyle='#3aa255';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}
}
function pitch(){
 ctx.fillStyle='#caa979';ctx.fillRect(330,320,440,300);
 ctx.fillStyle='#d7ba88';ctx.fillRect(365,320,370,300);
 ctx.strokeStyle='#fff';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(385,355);ctx.lineTo(715,355);ctx.moveTo(385,570);ctx.lineTo(715,570);ctx.stroke();
 for(const sx of [395,705])for(let j=0;j<3;j++){ctx.fillStyle='#f2d16c';ctx.fillRect(sx+j*7,535,4,40)}
}
function player(x,y,shirt,bat=false){
 ctx.fillStyle='#f0b08a';ctx.beginPath();ctx.arc(x,y,22,0,7);ctx.fill();
 ctx.fillStyle=shirt;ctx.fillRect(x-23,y+20,46,62);
 ctx.fillStyle='#eee';ctx.fillRect(x-18,y+82,14,45);ctx.fillRect(x+4,y+82,14,45);
 if(bat){ctx.save();ctx.translate(x+43,y+50);ctx.rotate(-.28);ctx.fillStyle='#d7a65e';ctx.fillRect(-7,-65,14,90);ctx.fillStyle='#684326';ctx.fillRect(-5,22,10,35);ctx.restore()}
}
function draw(){
 ctx.clearRect(0,0,c.width,c.height);stadium();pitch();
 player(550,235,'#d53d3d',false);player(550,450,'#1767d4',true);
 let bx=550,by=280;
 if(phase==='delivery'){t=Math.min(1,t+.011);by=275+t*260;document.getElementById('bar').style.width=(t*100)+'%';if(t>=1)shot('defence')}
 if(phase==='result'){result++;by=455-Math.min(result,65)*2.2;bx=shotName==='pull'?700:shotName==='cut'?770:650;if(result>65){phase='idle';text('Ball finished. Tap NEXT BALL.')}}
 ctx.fillStyle='#e53935';ctx.beginPath();ctx.arc(bx,by,10,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('INDIA',24,35);ctx.font='13px Arial';ctx.fillText('CARTOON STADIUM • DAY MATCH',24,57);
 ctx.fillStyle='#06131ecc';ctx.fillRect(825,18,245,75);ctx.fillStyle='#fff';ctx.font='bold 18px Arial';ctx.fillText(score+'/'+wickets,850,48);ctx.font='13px Arial';ctx.fillText('OVER '+Math.floor(balls/6)+'.'+balls%6+' • TARGET 121',850,72);
 requestAnimationFrame(draw);
}
update();draw();
</script>
</body>
</html>
